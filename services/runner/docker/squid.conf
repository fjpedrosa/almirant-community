# Almirant egress proxy - allowlist only
# Used by agent containers to restrict outbound traffic to approved domains.

acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain api.githubcopilot.com
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .openai.com
acl allowed_domains dstdomain .chatgpt.com
acl allowed_domains dstdomain generativelanguage.googleapis.com
acl allowed_domains dstdomain .almirant.ai
acl allowed_domains dstdomain mcp.context7.com
acl allowed_domains dstdomain .npmjs.org
acl allowed_domains dstdomain bun.sh
acl allowed_domains dstdomain api.z.ai
acl allowed_domains dstdomain .x.ai

# Resolve destinations inside Squid, then deny every non-global address before
# evaluating the hostname allowlist. This blocks rebinding of an allowed name
# to Docker, RFC1918, loopback, link-local, metadata, documentation or multicast
# space. Agent containers themselves have loopback-only DNS.
acl blocked_destinations dst 0.0.0.0/8
acl blocked_destinations dst 10.0.0.0/8
acl blocked_destinations dst 100.64.0.0/10
acl blocked_destinations dst 127.0.0.0/8
acl blocked_destinations dst 169.254.0.0/16
acl blocked_destinations dst 172.16.0.0/12
acl blocked_destinations dst 192.0.0.0/24
acl blocked_destinations dst 192.0.2.0/24
acl blocked_destinations dst 192.168.0.0/16
acl blocked_destinations dst 198.18.0.0/15
acl blocked_destinations dst 198.51.100.0/24
acl blocked_destinations dst 203.0.113.0/24
acl blocked_destinations dst 224.0.0.0/4
acl blocked_destinations dst 240.0.0.0/4
acl blocked_destinations dst ::/128
acl blocked_destinations dst ::1/128
acl blocked_destinations dst 2001:db8::/32
acl blocked_destinations dst fc00::/7
acl blocked_destinations dst fe80::/10
acl blocked_destinations dst ff00::/8

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_localhost
http_access deny to_linklocal
http_access deny blocked_destinations
http_access allow allowed_domains
http_access deny all

http_port 3128
# Keep one proxy-side DNS decision cached during normal request bursts. Clients
# never receive or independently resolve the destination address.
positive_dns_ttl 5 minutes
negative_dns_ttl 1 minute
forwarded_for delete
coredump_dir /var/spool/squid
# Use Squid's default log destinations. Writing stdio logs as user `proxy`
# breaks startup in the ubuntu/squid image because /dev/stdout is not writable.
cache deny all
