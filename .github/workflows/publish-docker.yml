name: Publish Docker images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra Docker tag to publish.
        required: false
        type: string

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    # Public-repo only: never run in forks (e.g. the private almirant-cloud fork).
    # Forks publishing images must define their own workflow/registry.
    if: github.repository == 'fjpedrosa/almirant-community'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: almirant-backend
            context: .
            file: backend/api/Dockerfile
            target: ""
          - image: almirant-db-init
            context: .
            file: backend/api/Dockerfile
            target: builder
          - image: almirant-frontend
            context: ./frontend
            file: frontend/Dockerfile
            target: ""
          - image: almirant-runner
            context: .
            file: services/runner/Dockerfile
            target: ""
          - image: almirant-web-bridge
            context: .
            file: services/web-bridge/Dockerfile
            target: ""
          - image: almirant-discord-bridge
            context: .
            file: services/discord-bridge/Dockerfile
            target: ""
          - image: almirant-updater
            context: .
            file: services/updater/Dockerfile
            target: ""
          - image: almirant-claude-shim
            context: .
            file: services/runner-claude/Dockerfile
            target: ""
          - image: almirant-codex-shim
            context: .
            file: services/runner/docker/Dockerfile.codex
            target: ""
          - image: almirant-pi-shim
            context: .
            file: services/runner/docker/Dockerfile.pi
            target: ""
          - image: almirant-opencode-shim
            context: .
            file: services/runner/docker/Dockerfile.opencode
            target: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.vendor=Almirant

      - name: Build and push Docker image
        id: push
        if: matrix.image != 'almirant-pi-shim'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALMIRANT_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://localhost' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || '/api' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || '' }}
            BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL || '' }}
            BETTER_AUTH_TRUSTED_ORIGINS=${{ vars.BETTER_AUTH_TRUSTED_ORIGINS || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Pi must pass both credential-free lifecycle checks and a deterministic
      # invalid-auth failure check before any registry tag can be mutated. Load
      # exactly one amd64 image and push that same local image after the gates.
      - name: Build pinned Pi image for runtime smoke
        if: matrix.image == 'almirant-pi-shim'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          platforms: linux/amd64
          tags: local/almirant-pi-shim:runtime-smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALMIRANT_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test Pi without credentials
        if: matrix.image == 'almirant-pi-shim'
        run: bash services/runner/scripts/pi-image-smoke.sh --image local/almirant-pi-shim:runtime-smoke

      - name: Smoke test Pi expected authentication failure
        if: matrix.image == 'almirant-pi-shim'
        run: |
          set -euo pipefail
          credential_file=/tmp/almirant-pi-smoke.ci-auth.env
          trap 'rm -f -- "$credential_file"' EXIT
          umask 077
          printf '%s\n' 'ZAI_API_KEY=ALMIRANT_PI_SMOKE_INVALID_AUTH_SENTINEL_4C27B1' > "$credential_file"
          chmod 0600 "$credential_file"
          bash services/runner/scripts/pi-image-smoke.sh \
            --image local/almirant-pi-shim:runtime-smoke \
            --env-file "$credential_file" \
            --env ZAI_API_KEY \
            --expect-auth-failure

      - name: Push the smoke-tested Pi image
        id: push-pi
        if: matrix.image == 'almirant-pi-shim'
        env:
          PUBLISH_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          local_tag=local/almirant-pi-shim:runtime-smoke
          published_digest=""
          published_tags=0

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              */almirant-pi-shim:*) ;;
              *) echo "::error::Unexpected Pi publication tag" >&2; exit 1 ;;
            esac

            docker tag "$local_tag" "$tag"
            push_output="$(docker push "$tag")"
            digest="$(printf '%s\n' "$push_output" | awk '{ for (i = 1; i < NF; i++) if ($i == "digest:" && $(i + 1) ~ /^sha256:[0-9a-f]{64}$/) print $(i + 1) }' | tail -n 1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Pi push did not return an immutable digest" >&2
              exit 1
            }
            if [ -n "$published_digest" ] && [ "$published_digest" != "$digest" ]; then
              echo "::error::Pi tags resolved to different immutable digests" >&2
              exit 1
            fi
            published_digest=$digest
            published_tags=$((published_tags + 1))
          done <<< "$PUBLISH_TAGS"

          [ "$published_tags" -gt 0 ] || {
            echo "::error::No Pi publication tags were produced" >&2
            exit 1
          }
          printf 'digest=%s\n' "$published_digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          subject-digest: ${{ matrix.image == 'almirant-pi-shim' && steps.push-pi.outputs.digest || steps.push.outputs.digest }}
          push-to-registry: true

      - name: Drop the local Pi smoke image
        if: always() && matrix.image == 'almirant-pi-shim'
        run: docker image rm -f local/almirant-pi-shim:runtime-smoke || true
